<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="author" content="Robert Tomkowski, rtom@kth.se" />
    <meta name="theme-color" content="#f4f4f6" />
    <meta
      name="description"
      content="Team engagement and weekly capacity planning. Your plan stays in your browser."
    />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='3' y='3' width='10' height='10' rx='3' fill='%235b5bd6'/%3E%3C/svg%3E" />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("tc-theme") ||
          (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        if (localStorage.getItem("tc-palette") === "warm") document.documentElement.dataset.palette = "warm";
      } catch {}
    </script>
    <style>
      body { margin: 0; background: #111214; }
      :root[data-theme="light"] body { background: #f6f7f9; }
      .startup { min-height: 100vh; display: grid; place-items: center; color: #8b8fa3;
        font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
    </style>
    <title>Team capacity</title>
  </head>
  <body>
    <div id="root">
      <div class="startup">
        <p>Loading Team capacity…</p>
        <noscript><p>Turn on JavaScript in your browser to use Team capacity.</p></noscript>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
